syntax = "proto3";

package payaja;

option go_package = "./pb";

// WalletService defines the gRPC service for wallet operations.
service WalletService {
    // GetBalance retrieves the current balance of a user's wallet.
    rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
    // TopUp adds funds to a user's wallet.
    rpc TopUp (TopUpRequest) returns (TopUpResponse);
    // Transfer moves funds from one user's wallet to another.
    rpc Transfer (TransferRequest) returns (TransferResponse);
}

message GetBalanceRequest {
    string user_id = 1;
}

message GetBalanceResponse {
    string user_id = 1;
    int64  balance = 2;
    string currency = 3;
}

message TopUpRequest {
    string user_id = 1;
    int64  amount  = 2;
}

message TopUpResponse {
    string user_id = 1;
    int64  balance = 2;
    string status  = 3;
}

message TransferRequest {
    string from_user_id = 1;
    string to_user_id   = 2;
    int64  amount       = 3;
}

message TransferResponse {
    string status = 1;
    string transaction_id = 2;
}